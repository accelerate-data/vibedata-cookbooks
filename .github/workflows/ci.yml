name: CI

on:
  pull_request:
  push:
    branches: [pre-prod, main]

permissions:
  contents: read

jobs:
  contract:
    name: Cookbook contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Recipes and Collections are valid
        run: python scripts/build_catalog.py --validate
      # catalog.json is regenerated after each merge to pre-prod by catalog.yml,
      # so feature pull requests never edit it. main must receive a fresh one.
      - name: Catalog is fresh on main
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main'
        run: python scripts/build_catalog.py --check
      - name: Schema changes carry a version bump
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against; skipping the version-bump check."
            exit 0
          fi
          python scripts/check_schema_versions.py --base "$base"

  promotion-source:
    name: Promotion source
    # Work lands on pre-prod; main takes only a promotion from pre-prod.
    # Skipped outside pull requests to main, which GitHub counts as passing.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: The pull request comes from pre-prod in this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "pre-prod" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::main takes only pull requests from $BASE_REPO:pre-prod, not $HEAD_REPO:$HEAD_REF. Target pre-prod instead."
            exit 1
          fi
