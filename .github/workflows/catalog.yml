name: Catalog

# Feature pull requests do not edit catalog.json, so concurrent Recipe pull
# requests never conflict on it. After each merge to pre-prod this job
# regenerates catalog.json and commits it, so readers still find a committed,
# fresh catalog on pre-prod and, after promotion, on main.

on:
  push:
    branches: [pre-prod]

permissions:
  contents: write

concurrency:
  group: catalog-pre-prod
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate catalog.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pre-prod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate catalog.json
        run: python scripts/build_catalog.py
      - name: Commit catalog.json if it changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json is already fresh."
            exit 0
          fi
          base="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(catalog): regenerate catalog.json after ${base::7}"
          if ! git push origin HEAD:pre-prod; then
            git fetch origin pre-prod
            if [ "$(git rev-parse origin/pre-prod)" != "$base" ]; then
              # A newer merge landed; its own run regenerates the catalog.
              echo "pre-prod moved past ${base::7}; the newer run regenerates catalog.json."
              exit 0
            fi
            exit 1
          fi
