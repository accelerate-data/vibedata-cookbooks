name: PR policy

# Runs on every pull request, including edits to the description, so a secret
# pasted into the body after the last push is still caught.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The script reads the PR body from the event file, never from a ${{ }} expression.
      - name: Check PR evidence and catalog edits
        run: python scripts/check_pr_policy.py --event "$GITHUB_EVENT_PATH"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned gitleaks
        run: |
          file=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" gitleaks
      - name: Scan the commits in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .
      - name: Scan the PR title and description
        run: |
          jq -r '(.pull_request.title // "") + "\n\n" + (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          ./gitleaks dir --redact --no-banner "$RUNNER_TEMP/pr-body.md"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Scanner catches a synthetic secret
        env:
          GITLEAKS_BIN: ./gitleaks
        run: python -m pytest -q tests/test_secret_scan.py
